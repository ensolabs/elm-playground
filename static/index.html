<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ensō Elm Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind via CDN (easy mode) -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- Mount point for Elm -->
    <div id="elm"></div>

    <!-- Elm bundle -->
    <script src="elm.js"></script>
    <script type="module">
      import guida from "https://esm.sh/guida";

      const init = async () => {
        const guidaApp = await guida.init({
          GUIDA_REGISTRY: "/proxy/https://package.elm-lang.org",
        });

        const app = Elm.Main.init({
          node: document.getElementById("elm"),
          flags: null,
        });

        app.ports.sendSrc.subscribe(async (srcCode) => {
          let res;
          try {
            res = await guidaApp.make(srcCode, {
              debug: false,
              optimize: false,
              sourcemaps: false,
            });

            app.ports.compilationSuccess.send(res.output);
          } catch (e) {
            app.ports.compilationError.send(res.error);
            window.__debugError = res.error;
          }
        });
      };

      init();
    </script>
  </body>
</html>
