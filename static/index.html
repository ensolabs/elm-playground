<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ensō Elm Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.png"/>
    
    <!-- Tailwind via CDN (easy mode) -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- Mount point for Elm -->
    <div id="elm"></div>

    <!-- Elm bundle -->
    <script src="elm.js"></script>
    <script type="module">
      import guida from "https://esm.sh/guida";

      const init = async () => {
        const guidaApp = await guida.init({
          GUIDA_REGISTRY: "/proxy/https://package.elm-lang.org",
        });

        const app = Elm.Main.init({
          node: document.getElementById("elm"),
          flags: null,
        });

        const installDeps = async (deps) => {
          if (!deps?.length) {
            console.log("No dependencies to install");
            return;
          }

          console.log("Installing dependencies:", deps);

          try {
            // Try different approaches based on what install() actually returns
            const installs = await Promise.all(
              deps.map(async (dep) => {
                console.log(`Installing ${dep}...`);
                try {
                  const result = await guidaApp.install(dep);
                  console.log(`Install result for ${dep}:`, result);
                  return result;
                } catch (e) {
                  console.error(`Failed to install ${dep}:`, e);
                  throw e;
                }
              }),
            );

            console.log("All install calls completed:", installs);
            console.log("Installation successful");
          } catch (e) {
            console.warn("Installation failed: ", e);
            throw e; // Re-throw so compilation doesn't proceed with missing deps
          }
        };

        app.ports.sendSrc.subscribe(async ({ code, deps }) => {
          await installDeps(deps);

          let res;
          try {
            console.log("starting compilation...");
            res = await guidaApp.make(code, {
              debug: false,
              optimize: false,
              sourcemaps: false,
            });
            console.log("compilation successful");

            app.ports.compilationSuccess.send(res.output);
          } catch (e) {
            console.warn("compilation failed: ", e);
            app.ports.compilationError.send(res.error);
            window.__debugError = res.error;
          }
        });
      };

      init();
    </script>
  </body>
</html>
